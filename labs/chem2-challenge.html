<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي كيمياء 2</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><polygon points='18,3 31,10.5 31,25.5 18,33 5,25.5 5,10.5' stroke='%236650c5' stroke-width='2.4' fill='none'/><circle cx='18' cy='18' r='4.5' fill='%230d9488'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", sans-serif;
      color: #27334b;
      background:
        radial-gradient(circle at 8% 8%, #dcd8fa 0, transparent 30%),
        radial-gradient(circle at 92% 80%, #c9ecea 0, transparent 32%),
        linear-gradient(135deg, #f8f7ff, #eef8fa);
    }
    button, input { font-family: "Tajawal", sans-serif; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #0d9488;
      outline-offset: 3px;
    }
    .shell { max-width: 840px; margin: auto; padding: 28px 18px 56px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .top-nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .nav-pill { text-decoration: none; padding: 7px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; transition: opacity .2s; }
    .nav-pill.light { background: #fff; border: 1px solid #dcd7e8; color: #5941a0; }
    .nav-pill.accent { background: #6650c5; color: #fff; }
    .nav-pill:hover { opacity: .9; }
    .brand { display: flex; align-items: center; gap: 10px; color: #5941a0; font-weight: 800; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: #ebe7fb; }
    .brand-mark svg { width: 21px; }
    .hero { text-align: center; padding: 32px 0 22px; }
    .eyebrow { display: inline-block; color: #6350a6; background: #ece9fb; border-radius: 99px; padding: 8px 16px; font-size: 14px; font-weight: 800; }
    h1 { color: #322566; font-size: clamp(34px, 7vw, 54px); line-height: 1.16; margin: 15px 0 12px; }
    .intro { max-width: 570px; margin: 0 auto; color: #66718a; font-size: 17px; line-height: 1.8; }
    .card { position: relative; background: white; border: 1px solid #e8e8f3; border-radius: 28px; padding: clamp(22px, 5vw, 40px); box-shadow: 0 20px 55px rgba(53, 48, 103, .09); overflow: hidden; }
    .start-card { max-width: 600px; margin: auto; }
    .section-kicker { display: flex; align-items: center; gap: 9px; color: #6650b1; font-weight: 800; margin-bottom: 12px; }
    .section-kicker svg { width: 19px; }
    h2 { color: #30265b; font-size: clamp(23px, 4vw, 30px); line-height: 1.45; margin: 0 0 20px; }
    .field { margin: 18px 0; }
    label { display: block; font-weight: 800; margin-bottom: 8px; color: #39435b; }
    input { width: 100%; border: 1.5px solid #dce1ec; border-radius: 14px; background: #fbfcff; color: #27334b; padding: 15px 16px; font-size: 17px; }
    input::placeholder { color: #9aa3b4; }
    .primary { border: 0; border-radius: 14px; background: #6650c5; color: white; padding: 15px 26px; font-size: 17px; font-weight: 800; cursor: pointer; transition: background .2s, transform .2s; }
    .primary:hover { background: #533bad; transform: translateY(-2px); }
    .wide { width: 100%; margin-top: 12px; }
    .note { color: #788198; font-size: 14px; line-height: 1.7; margin: 18px 0 0; }
    .topline, .progress-labels { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .topline { font-weight: 800; color: #59647e; flex-wrap: wrap; }
    .pill { background: #f0edfc; color: #6046b8; border-radius: 99px; padding: 9px 15px; font-size: 14px; }
    .progress-labels { color: #7a849b; font-size: 14px; font-weight: 700; margin: 24px 0 8px; }
    .progress { height: 10px; background: #e9e8f2; border-radius: 99px; overflow: hidden; margin-bottom: 30px; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, #14b8aa, #7661d3); border-radius: inherit; transition: width .35s; }
    .options { display: grid; gap: 12px; }
    .option { width: 100%; border: 2px solid #e9eaf3; border-radius: 15px; background: #fafbff; padding: 15px 17px; text-align: right; color: #303a52; font-size: 17px; line-height: 1.5; cursor: pointer; transition: background .2s, border-color .2s, transform .2s; }
    .option:not(:disabled):hover { background: #f2efff; border-color: #a99be2; transform: translateY(-1px); }
    .option:disabled { cursor: default; }
    .option.correct { background: #e6f8ef; border-color: #37b87d; color: #176044; }
    .option.wrong { background: #fff0ef; border-color: #e7807d; color: #9b4140; }
    .feedback { margin-top: 22px; padding: 17px 19px; border-radius: 15px; line-height: 1.7; }
    .feedback.good { background: #e8f8f1; color: #175e42; }
    .feedback.bad { background: #fff1f0; color: #853b3b; }
    .feedback strong { display: block; font-size: 20px; margin-bottom: 3px; }
    .feedback p, .enrichment p { margin: 4px 0 0; }
    .enrichment { margin-top: 12px; padding: 17px 19px; border-radius: 15px; border-right: 4px solid #44a9b2; background: #edf8fa; line-height: 1.7; color: #345768; }
    .enrichment strong { color: #236b78; }
    .advance { margin: 15px 0 0; color: #788198; font-size: 14px; }
    .result { text-align: center; }
    .result-icon { display: grid; place-items: center; width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 22px; background: #f1edff; color: #7056c7; }
    .result-icon svg { width: 36px; height: 36px; }
    .score { font-size: clamp(42px, 9vw, 66px); color: #5940b4; font-weight: 800; line-height: 1.2; margin: 8px 0; }
    .result p { color: #68728a; line-height: 1.7; font-size: 17px; }
    .level { display: inline-block; padding: 9px 18px; border-radius: 99px; background: #eaf8f5; color: #168376; font-weight: 800; margin: 7px 0 18px; }
    .certificate { position: relative; margin-top: 20px; text-align: center; padding: clamp(24px, 5vw, 43px); background: linear-gradient(145deg, #fffdf7, #fff 55%, #f8f5e9); border: 2px solid #d5b76b; border-radius: 23px; box-shadow: inset 0 0 0 7px #fff, inset 0 0 0 9px #ead9ae; }
    .medal { display: grid; place-items: center; width: 88px; height: 88px; margin: 0 auto 15px; border-radius: 50%; background: linear-gradient(135deg, #fff0ac, #c99432, #f8da75); color: #76500f; box-shadow: 0 8px 20px rgba(153, 103, 24, .2); }
    .medal svg { width: 46px; height: 46px; }
    .certificate h2 { color: #876523; margin-bottom: 8px; }
    .certificate p { margin: 7px 0; color: #6f6670; line-height: 1.7; }
    .student-name { color: #33255f !important; font-size: clamp(25px, 5vw, 36px) !important; font-weight: 800; overflow-wrap: anywhere; }
    .certificate .class-line { color: #8b743f; }
    .restart { margin-top: 24px; }
    footer { text-align: center; color: #8890a1; font-size: 14px; margin-top: 25px; }
    .star { position: absolute; z-index: 2; pointer-events: none; font-size: 24px; animation: burst 1.15s ease-out forwards; }
    @keyframes burst { from { opacity: 1; transform: translate(0,0) rotate(0) scale(.5); } to { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.2); } }
    @media (max-width: 520px) { .shell { padding: 18px 14px 40px; } .hero { padding: 24px 0 20px; } .card { border-radius: 22px; } .option { font-size: 16px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
 </head>
 <body>
  <div id="app"></div>
  <script>
    const questions = [
      {
        question:"1. أكبر الألوان من حيث الطول الموجي هو:",
        options:["البنفسجي","الأخضر","البرتقالي","الأحمر"],
        correctIndex:3,
        feedback:"اللون الأحمر يمتلك أكبر طول موجي في الطيف المرئي.",
        enrichment:"كلما زاد الطول الموجي قل التردد."
      },
      {
        question:"2. تتميز الأشعة السينية بأنها:",
        options:["طول موجي كبير وتردد صغير","طول موجي صغير وتردد كبير","طول موجي كبير وتردد كبير","طول موجي صغير وتردد صغير"],
        correctIndex:1,
        feedback:"الأشعة السينية ذات طول موجي قصير وتردد مرتفع.",
        enrichment:"لذلك تمتلك طاقة عالية وتستخدم في التصوير الطبي."
      },
      {
        question:"3. طيف الانبعاث الذري يستخدم في:",
        options:["تحديد الكتلة","التعرف على العنصر","قياس الضغط","قياس الحجم"],
        correctIndex:1,
        feedback:"لكل عنصر بصمة طيفية خاصة به.",
        enrichment:"تستخدم هذه الخاصية في التحليل الطيفي."
      },
      {
        question:"4. نموذج بور يفسر طيف ذرة:",
        options:["الصوديوم","الهيليوم","الهيدروجين","الأكسجين"],
        correctIndex:2,
        feedback:"نجح نموذج بور في تفسير طيف الهيدروجين فقط.",
        enrichment:"اعتمد بور على مستويات طاقة محددة."
      },
      {
        question:"5. مبدأ هايزنبرج ينص على:",
        options:["استحالة تحديد مكان وسرعة الإلكترون معاً بدقة","كل إلكترونين في المدار نفسه","امتلاء المدارات الأقل طاقة أولاً","الإلكترونات المفردة أولاً"],
        correctIndex:0,
        feedback:"هذا هو مبدأ عدم التأكد لهايزنبرج.",
        enrichment:"كلما زادت دقة الموقع قلت دقة الزخم."
      },
      {
        question:"6. عدد الإلكترونات القصوى في المستوى الثاني هو:",
        options:["2","8","18","32"],
        correctIndex:1,
        feedback:"المستوى الثاني يستوعب 8 إلكترونات.",
        enrichment:"وفق العلاقة 2n²."
      },
      {
        question:"7. عدد المدارات في المستوى الفرعي p هو:",
        options:["1","3","5","7"],
        correctIndex:1,
        feedback:"المستوى p يحتوي ثلاثة أوربيتالات.",
        enrichment:"كل مدار يستوعب إلكترونين."
      },
      {
        question:"8. عدد الإلكترونات التي يستوعبها المستوى الفرعي d هو:",
        options:["6","8","10","14"],
        correctIndex:2,
        feedback:"d يحتوي 5 أوربيتالات × 2 إلكترون.",
        enrichment:"إجمالي السعة = 10 إلكترونات."
      },
      {
        question:"9. أول مستوى يمتلئ بالإلكترونات هو:",
        options:["3d","4f","4s","5p"],
        correctIndex:2,
        feedback:"4s يسبق 3d في الامتلاء.",
        enrichment:"طبقاً لمبدأ أوفباو."
      },
      {
        question:"10. مبدأ أوفباو يعني:",
        options:["ملء المدارات الأعلى أولاً","ملء المدارات الأقل طاقة أولاً","إلكترونين متعاكسين فقط","التوزيع العشوائي"],
        correctIndex:1,
        feedback:"الإلكترونات تشغل أقل المدارات طاقة أولاً.",
        enrichment:"يستخدم لكتابة التوزيع الإلكتروني."
      },
      {
        question:"11. عناصر المجموعة 1 تسمى:",
        options:["الهالوجينات","الفلزات القلوية","الغازات النبيلة","الفلزات الانتقالية"],
        correctIndex:1,
        feedback:"المجموعة الأولى هي الفلزات القلوية.",
        enrichment:"منها الليثيوم والصوديوم والبوتاسيوم."
      },
      {
        question:"12. عناصر المجموعة 18 هي:",
        options:["فلزات قلوية","هالوجينات","غازات نبيلة","أشباه فلزات"],
        correctIndex:2,
        feedback:"عناصرها مستقرة كيميائياً.",
        enrichment:"مثل الهيليوم والنيون والأرجون."
      },
      {
        question:"13. أصغر نصف قطر ذري بين الهالوجينات:",
        options:["Cl","Br","I","F"],
        correctIndex:3,
        feedback:"الفلور أصغرها حجماً.",
        enrichment:"يزداد الحجم نزولاً في المجموعة."
      },
      {
        question:"14. أعلى العناصر كهروسالبية:",
        options:["Cl","O","F","N"],
        correctIndex:2,
        feedback:"الفلور أعلى العناصر كهروسالبية.",
        enrichment:"قيمته تقارب 4 على مقياس باولنج."
      },
      {
        question:"15. تزداد طاقة التأين عبر الدورة بسبب:",
        options:["زيادة الحجم الذري","زيادة الشحنة النووية","زيادة عدد المستويات","انخفاض الكهروسالبية"],
        correctIndex:1,
        feedback:"زيادة جذب النواة للإلكترونات.",
        enrichment:"لذلك يصعب نزع الإلكترون."
      },
      {
        question:"16. الأيون الموجب يتكون نتيجة:",
        options:["اكتساب إلكترونات","فقد إلكترونات","فقد بروتونات","اكتساب نيوترونات"],
        correctIndex:1,
        feedback:"عند فقد الإلكترونات تصبح الشحنة موجبة.",
        enrichment:"مثل Na⁺."
      },
      {
        question:"17. الرابطة الأيونية تنتج من:",
        options:["مشاركة إلكترونات","انتقال إلكترونات","قوى لندن","روابط هيدروجينية"],
        correctIndex:1,
        feedback:"تنتقل الإلكترونات من الفلز إلى اللافلز.",
        enrichment:"مثال NaCl."
      },
      {
        question:"18. الرابطة في جزيء HCl:",
        options:["فلزية","أيونية","تساهمية قطبية","هيدروجينية"],
        correctIndex:2,
        feedback:"فرق الكهروسالبية يجعلها قطبية.",
        enrichment:"يتشارك العنصران زوجاً إلكترونياً."
      },
      {
        question:"19. الرابطة الفلزية هي تجاذب بين:",
        options:["أيونات سالبة وموجبة","نوى الذرات والإلكترونات الحرة","بروتونات ونيوترونات","ذرات ولافلزات"],
        correctIndex:1,
        feedback:"الإلكترونات الحرة تربط الشبكة الفلزية.",
        enrichment:"تفسر التوصيل الكهربائي للفلزات."
      },
      {
        question:"20. عدد روابط سيجما وباي في C2H2:",
        options:["3 سيجما و2 باي","2 سيجما و1 باي","4 سيجما و1 باي","1 سيجما و3 باي"],
        correctIndex:0,
        feedback:"الرابطة الثلاثية = 1 سيجما + 2 باي.",
        enrichment:"الأستيلين مثال للألكاينات."
      }
    ];

    const app = document.getElementById("app");
    let studentName = "";
    let studentClass = "";
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let advanceTimer = null;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function icon(name) {
      const node = document.createElement("i");
      node.setAttribute("data-lucide", name);
      return node;
    }
    function refreshIcons() { if (window.lucide) lucide.createIcons(); }
    function layout() {
      app.replaceChildren();
      const main = el("main", "shell");
      main.id = "quiz-main";
      const topBar = el("div", "top-bar");
      const brand = el("div", "brand");
      const mark = el("span", "brand-mark");
      mark.append(icon("flask-conical"));
      brand.append(mark, el("span", "", "مختبر المعرفة"));
      const nav = el("nav", "top-nav");
      nav.setAttribute("aria-label", "التنقل");
      const homeLink = el("a", "nav-pill light", "الرئيسية");
      homeLink.href = "../index.html";
      const bookLink = el("a", "nav-pill accent", "كيمياء 2-1");
      bookLink.href = "../chem-2-1.html";
      nav.append(homeLink, bookLink);
      topBar.append(brand, nav);
      const hero = el("header", "hero");
      hero.append(
        el("span", "eyebrow", "تجربة تعلّم تفاعلية"),
        el("h1", "", "تحدي كيمياء 2"),
        el("p", "intro", "رحلة قصيرة من الأسئلة والتفسيرات العلمية، خطوة بخطوة نحو التميز.")
      );
      const card = el("section", "card");
      card.id = "quiz-card";
      const footer = el("footer", "", `الأسئلة المتاحة: ${questions.length} سؤالًا من موضوعات كيمياء 2`);
      main.append(topBar, hero, card, footer);
      app.append(main);
      refreshIcons();
      return card;
    }
    function renderStart() {
      const card = layout();
      card.classList.add("start-card");
      const kicker = el("div", "section-kicker");
      kicker.append(icon("sparkles"), el("span", "", "جاهزة للانطلاق؟"));
      const heading = el("h2", "", "ابدئي رحلتك العلمية");
      heading.id = "start-heading";
      card.setAttribute("aria-labelledby", "start-heading");
      const form = el("form");
      form.id = "start-form";
      const nameField = el("div", "field");
      const nameLabel = el("label", "", "اسم الطالبة");
      nameLabel.htmlFor = "student-name";
      const nameInput = el("input");
      nameInput.id = "student-name";
      nameInput.name = "studentName";
      nameInput.placeholder = "اكتبي اسمك هنا";
      nameInput.required = true;
      nameInput.maxLength = 80;
      nameField.append(nameLabel, nameInput);
      const classField = el("div", "field");
      const classLabel = el("label", "", "الشعبة");
      classLabel.htmlFor = "student-class";
      const classInput = el("input");
      classInput.id = "student-class";
      classInput.name = "studentClass";
      classInput.placeholder = "مثال: 2 / أ";
      classInput.required = true;
      classInput.maxLength = 40;
      classField.append(classLabel, classInput);
      const start = el("button", "primary wide", "ابدئي المسابقة");
      start.type = "submit";
      form.append(nameField, classField, start);
      form.addEventListener("submit", event => {
        event.preventDefault();
        studentName = nameInput.value.trim();
        studentClass = classInput.value.trim();
        if (!studentName || !studentClass) return;
        currentQuestion = 0;
        score = 0;
        renderQuestion();
      });
      card.append(kicker, heading, form, el("p", "note", "بعد كل إجابة، ستظهر لكِ تغذية راجعة ومعلومة إثرائية قبل الانتقال تلقائيًا."));
      refreshIcons();
    }
    function renderQuestion() {
      answered = false;
      const card = layout();
      const item = questions[currentQuestion];
      const top = el("div", "topline");
      top.append(el("span", "", `السؤال ${currentQuestion + 1} من ${questions.length}`), el("span", "pill", `النتيجة: ${score}`));
      const progressLabels = el("div", "progress-labels");
      progressLabels.append(el("span", "", "تقدمك في المسابقة"), el("span", "", `${Math.round(currentQuestion / questions.length * 100)}%`));
      const progress = el("div", "progress");
      progress.setAttribute("role", "progressbar");
      progress.setAttribute("aria-label", "تقدم المسابقة");
      progress.setAttribute("aria-valuemin", "0");
      progress.setAttribute("aria-valuemax", "100");
      progress.setAttribute("aria-valuenow", String(Math.round(currentQuestion / questions.length * 100)));
      const bar = el("div", "bar");
      bar.style.width = `${currentQuestion / questions.length * 100}%`;
      progress.append(bar);
      const heading = el("h2", "", item.question);
      heading.id = "question-heading";
      card.setAttribute("aria-labelledby", "question-heading");
      const options = el("div", "options");
      options.id = "answer-options";
      item.options.forEach((text, index) => {
        const button = el("button", "option", text);
        button.type = "button";
        button.addEventListener("click", () => chooseAnswer(index));
        options.append(button);
      });
      card.append(top, progressLabels, progress, heading, options);
    }
    function burst(card) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const colors = ["#eab84b", "#9b7be0", "#39b9ab", "#e783a6", "#72a5e7"];
      for (let i = 0; i < 19; i++) {
        const star = el("span", "star", "✦");
        star.setAttribute("aria-hidden", "true");
        star.style.top = "51%";
        star.style.left = "50%";
        star.style.color = colors[i % colors.length];
        star.style.setProperty("--x", `${(Math.random() - .5) * 520}px`);
        star.style.setProperty("--y", `${(Math.random() - .5) * 320}px`);
        star.style.setProperty("--r", `${Math.random() * 540}deg`);
        star.style.animationDelay = `${Math.random() * .14}s`;
        card.append(star);
        star.addEventListener("animationend", () => star.remove(), { once: true });
      }
    }
    function chooseAnswer(index) {
      if (answered) return;
      answered = true;
      const item = questions[currentQuestion];
      const correct = index === item.correctIndex;
      if (correct) score++;
      const buttons = [...document.querySelectorAll("#answer-options button")];
      buttons.forEach((button, buttonIndex) => {
        button.disabled = true;
        if (buttonIndex === item.correctIndex) button.classList.add("correct");
        else if (buttonIndex === index) button.classList.add("wrong");
      });
      const card = document.getElementById("quiz-card");
      const feedback = el("div", `feedback ${correct ? "good" : "bad"}`);
      feedback.setAttribute("role", "status");
      feedback.append(
        el("strong", "", correct ? "أحسنتِ ✨" : `الإجابة الصحيحة: ${item.options[item.correctIndex]}`),
        el("p", "", item.feedback)
      );
      const enrichment = el("div", "enrichment");
      enrichment.append(el("strong", "", "معلومة إثرائية"), el("p", "", item.enrichment));
      card.append(feedback, enrichment, el("p", "advance", "سيظهر السؤال التالي تلقائيًا بعد قليل…"));
      if (correct) burst(card);
      const progress = card.querySelector(".progress");
      const value = Math.round((currentQuestion + 1) / questions.length * 100);
      progress.setAttribute("aria-valuenow", String(value));
      card.querySelector(".bar").style.width = `${value}%`;
      card.querySelector(".progress-labels span:last-child").textContent = `${value}%`;
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < questions.length) renderQuestion();
        else renderResult();
      }, 3500);
    }
    function performanceLevel(percent) {
      if (percent >= 90) return "ممتاز";
      if (percent >= 75) return "جيد جدًا";
      if (percent >= 60) return "جيد";
      return "واصلي التعلّم";
    }
    function renderResult() {
      const card = layout();
      card.classList.add("result");
      const percent = Math.round(score / questions.length * 100);
      const resultIcon = el("div", "result-icon");
      resultIcon.append(icon("trophy"));
      const heading = el("h2", "", "اكتملت المسابقة!");
      heading.id = "result-heading";
      card.setAttribute("aria-labelledby", "result-heading");
      const certificate = el("section", "certificate");
      certificate.id = "certificate";
      const medal = el("div", "medal");
      medal.setAttribute("aria-label", "وسام تميز ذهبي");
      medal.append(icon("award"));
      const certHeading = el("h2", "", "شهادة شكر وتقدير");
      certificate.append(
        medal, certHeading,
        el("p", "", "تُقدّم هذه الشهادة بكل تقدير إلى الطالبة"),
        el("p", "student-name", studentName),
        el("p", "class-line", `الشعبة: ${studentClass}`),
        el("p", "", "تقديرًا لمشاركتها واجتهادها في مسابقة كيمياء 2.")
      );
      const restart = el("button", "primary restart", "إعادة المسابقة");
      restart.type = "button";
      restart.addEventListener("click", () => {
        clearTimeout(advanceTimer);
        score = 0;
        currentQuestion = 0;
        renderStart();
      });
      card.append(
        resultIcon, heading,
        el("div", "score", `${score} من ${questions.length}`),
        el("p", "", `نسبة الإنجاز: ${percent}%`),
        el("div", "level", `مستوى الأداء: ${performanceLevel(percent)}`),
        certificate, restart
      );
      refreshIcons();
    }
    renderStart();
  </script>
 </body>
</html>
